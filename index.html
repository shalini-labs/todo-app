<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📝 My To-Do App</h1>

        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button id="addBtn">
                Add Task
            </button>

        </div>

        <!-- Dashboard Stats -->
        <div class="stats-section">

            <div class="stat-card">
                <span class="stat-label">Total</span>
                <strong id="totalStat">0</strong>
            </div>

            <div class="stat-card">
                <span class="stat-label">Pending</span>
                <strong id="pendingStat">0</strong>
            </div>

            <div class="stat-card">
                <span class="stat-label">Completed</span>
                <strong id="completedStat">0</strong>
            </div>

        </div>

        <!-- Progress -->
        <div class="progress-section">

            <div class="progress-header">
                <span>Progress</span>
                <strong id="progressText">0%</strong>
            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

        </div>

        <h3>
            Total Tasks:
            <span id="taskCount">0</span>
        </h3>

        <h2>📋 My Tasks</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search tasks..."
        >

        <div class="filter-section">

            <button id="allBtn">All</button>
            <button id="pendingBtn">Pending</button>
            <button id="completedBtn">Completed</button>

        </div>

        <div id="taskList"></div>

        <button id="clearBtn">
            Clear All
        </button>

        <hr>

        <h2>🗑 Recycle Bin</h2>

        <div id="recycleBin"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
